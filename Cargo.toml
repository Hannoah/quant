[package]
name = "quant"
version = "0.2.0"
edition = "2024"
description = "Interactive quant data CLI: Upbit & Yahoo Finance collector, sparklines, watchlist & self-updater"
license = "MIT"
repository = "https://github.com/Hannoah/quant"
readme = "README.md"

[[bin]]
name = "quant"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
chrono = "0.4"
csv = "1"
crossterm = "0.29"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
await_holding_lock = "deny"
large_futures = "warn"
needless_pass_by_value = "warn"
